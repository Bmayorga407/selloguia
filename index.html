<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src blob:; worker-src 'self' blob: https://cdnjs.cloudflare.com; connect-src 'self' https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>SelloGuía — Automatiza tus guías de despacho</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0c10;
  --surface: #12141a;
  --surface2: #191c24;
  --surface3: #202531;
  --border: #2a2f3b;
  --border-light: #3a4150;
  --text: #f1f3f7;
  --text2: #b4bac6;
  --text3: #727b8c;
  --red: #e8111b;
  --green: #34d399;
  --amber: #fbbf24;
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 180ms ease-out;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.3);
}

*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
html{color-scheme:dark}

body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
  touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:transparent;
  pointer-events:none;
  z-index:0;
}

/* Header */
.header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  height:54px;
  background:rgba(18,20,26,0.94);
  border-bottom:1px solid var(--border);
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
  font-size:1.15rem;
  letter-spacing:0;
}
.logo mark{
  background:var(--red);
  color:#fff;
  padding:3px 10px;
  border-radius:6px;
  font-size:0.85rem;
  font-weight:600;
}
.header-right{
  display:flex;
  align-items:center;
  gap:12px;
}
.page-count{
  font-family:'DM Mono',monospace;
  font-size:0.8rem;
  color:var(--text3);
  background:var(--surface2);
  padding:5px 12px;
  border-radius:20px;
  border:1px solid var(--border);
  opacity:0;
  transform:translateX(8px);
  transition:opacity var(--transition),transform var(--transition);
}
.page-count.visible{opacity:1;transform:translateX(0)}

/* Layout */
.app-layout{
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
  flex:1;
  position:relative;
  z-index:10;
  min-height:0;
  height:calc(100dvh - 54px);
}

/* Sidebar */
.sidebar{
  background:rgba(18,20,26,0.86);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:18px 14px;
  gap:16px;
  overflow-y:auto;
}
.sidebar-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.sidebar-header h2{
  font-size:0.8rem;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0;
  color:var(--text3);
}
.btn-icon{
  width:32px;
  height:32px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text2);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.1rem;
  transition:background-color var(--transition),border-color var(--transition),color var(--transition),transform var(--transition),opacity var(--transition);
}
.btn-icon:hover{
  background:var(--surface3);
  border-color:var(--border-light);
  color:var(--text);
}
.btn-icon:focus-visible,.btn:focus-visible,.stamp-item:focus-visible,.stamp-delete:focus-visible{
  outline:2px solid var(--red);
  outline-offset:3px;
}

/* Stamp list */
.stamp-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.stamp-row{position:relative}
.stamp-item{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:10px 12px;
  border-radius:var(--radius-sm);
  background:var(--surface2);
  border:2px solid transparent;
  color:var(--text);
  font:inherit;
  text-align:left;
  cursor:pointer;
  transition:background-color var(--transition),border-color var(--transition),opacity var(--transition);
}
.stamp-item:hover{
  background:var(--surface3);
  border-color:var(--border-light);
}
.stamp-item.selected{
  border-color:var(--red);
  background:rgba(232,17,27,0.16);
}
.stamp-thumb{
  width:44px;
  height:44px;
  border-radius:8px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
  border:1px solid var(--border);
}
.stamp-thumb img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:2px;
}
.stamp-thumb .placeholder{
  color:var(--text3);
  font-size:1.2rem;
}
.stamp-info{
  flex:1;
  min-width:0;
}
.stamp-name{
  font-size:0.85rem;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.stamp-meta{
  font-family:'DM Mono',monospace;
  font-size:0.68rem;
  color:var(--text3);
  margin-top:2px;
}
.stamp-delete{
  position:absolute;
  top:6px;
  right:8px;
  width:20px;
  height:20px;
  border-radius:5px;
  border:none;
  background:transparent;
  color:var(--text3);
  cursor:pointer;
  font-size:0.9rem;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transition:opacity var(--transition),background-color var(--transition),color var(--transition);
}
.stamp-row:hover .stamp-delete,.stamp-delete:focus-visible{opacity:1}
.stamp-delete:hover{background:var(--red);color:#fff}
.sidebar-empty{
  text-align:center;
  padding:32px 16px;
  color:var(--text3);
  font-size:0.8rem;
  line-height:1.6;
}
.sidebar-empty .icon{
  font-size:2rem;
  margin-bottom:8px;
  opacity:0.4;
}

/* Main content */
.main-content{
  display:flex;
  flex-direction:column;
  padding:18px 22px;
  gap:14px;
  overflow:hidden;
  min-width:0;
}

/* Upload zone */
.upload-zone{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:2px dashed var(--border);
  border-radius:var(--radius);
  background:var(--surface);
  transition:border-color var(--transition),background-color var(--transition),box-shadow var(--transition);
  cursor:pointer;
  min-height:320px;
  width:100%;
  color:var(--text);
  font-family:inherit;
}
.upload-zone:hover,.upload-zone.drag-over{
  border-color:var(--red);
  background:var(--surface2);
  box-shadow:inset 0 0 0 1px rgba(232,17,27,0.18);
}
.upload-zone.drag-over{border-style:solid}
.upload-icon{
  border:1px solid var(--border);
  width:64px;
  height:64px;
  border-radius:16px;
  background:var(--surface2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.8rem;
  margin-bottom:16px;
  color:var(--text);
  cursor:inherit;
  transition:transform var(--transition),border-color var(--transition),background-color var(--transition);
}
.upload-icon:hover{transform:translateY(-1px);border-color:var(--red);background:var(--surface3)}
.upload-icon:focus-visible{outline:2px solid var(--red);outline-offset:4px}
.upload-zone h3{font-size:1.1rem;font-weight:600;margin-bottom:4px}
.upload-zone p{color:var(--text3);font-size:0.82rem}
.upload-hint{
  margin-top:16px;
  font-family:'DM Mono',monospace;
  font-size:0.7rem;
  color:var(--text3);
  padding:6px 14px;
  background:var(--surface2);
  border-radius:20px;
  border:1px solid var(--border);
}

/* Workspace */
.workspace{display:none;gap:12px;min-height:0}
.workspace.active{
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  grid-template-rows:minmax(0,1fr);
  gap:14px;
  align-items:start;
  height:100%;
}
.workspace-toolbar{
  display:none;
}
.file-badge{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--surface2);
  padding:8px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  font-size:0.85rem;
}
.file-badge .name{font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-badge .pages{font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--text3)}
.file-badge .close{cursor:pointer;color:var(--text3);font-size:1rem;transition:color var(--transition);background:transparent;border:0;font:inherit}
.file-badge .close:hover{color:var(--red)}

/* Editor */
.editor-section{min-height:0;overflow:hidden;display:flex}
.editor-card{
  background:rgba(18,20,26,0.78);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px 18px 20px;
  display:flex;
  flex-direction:column;
  gap:12px;
  min-height:0;
  width:100%;
  box-shadow:0 20px 80px rgba(0,0,0,0.24);
}
.editor-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}
.editor-header h3{
  font-size:0.78rem;
  font-weight:650;
  color:var(--text2);
  letter-spacing:0;
  text-wrap:balance;
}

.canvas-wrapper{
  position:relative;
  width:min(100%,620px,calc((100dvh - 160px) * 0.7727));
  aspect-ratio:8.5 / 11;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--border-light);
  background:#eef1f6;
  box-shadow:0 22px 70px rgba(0,0,0,0.46);
  user-select:none;
  line-height:0;
  align-self:center;
  justify-self:center;
  padding:12px;
  margin:auto;
}
.canvas-wrapper canvas{
  display:block;
  width:100%;
  height:auto;
  border-radius:4px;
  box-shadow:0 8px 24px rgba(5,8,14,0.22);
}
.canvas-wrapper canvas:last-child{
  position:absolute;
  top:12px;
  left:12px;
  width:calc(100% - 24px);
  height:auto;
  box-shadow:none;
}

#markerCanvas{cursor:grab}
#markerCanvas:active{cursor:grabbing}

/* Live time */
.live-time{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(25,28,36,0.86);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:10px 16px;
  font-family:'DM Mono',monospace;
}
.live-time .label{font-size:0.72rem;color:var(--text3)}
.live-time .value{font-size:1.05rem;font-weight:700;color:var(--green);letter-spacing:0}

/* Buttons */
.btn{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:10px 20px;
  border-radius:8px;
  font-size:0.85rem;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  border:none;
  transition:transform var(--transition),background-color var(--transition),border-color var(--transition),box-shadow var(--transition),color var(--transition),opacity var(--transition);
  white-space:nowrap;
}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.28)}
.btn-primary:hover{background:#f01f29;box-shadow:0 4px 14px rgba(0,0,0,0.32);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--surface3);border-color:var(--border-light)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid transparent}
.btn-ghost:hover{background:var(--surface2);border-color:var(--border);color:var(--text)}
.btn-sm{padding:6px 12px;font-size:0.78rem;border-radius:6px}
.action-bar{
  position:static;
  z-index:10;
  align-self:start;
  max-width:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-direction:column;
  gap:14px;
  background:rgba(25,28,36,0.9);
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
  box-shadow:0 12px 44px rgba(0,0,0,0.22);
}
.action-summary{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-width:0;
}
.action-summary .status-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--surface3);
  border:1px solid var(--border-light);
}
.action-copy{display:flex;flex-direction:column;gap:3px}
.action-copy strong{font-size:0.9rem;font-weight:700;text-wrap:balance}
.action-copy span{font-size:0.76rem;color:var(--text3);text-wrap:pretty}
.btn-main{
  width:100%;
  min-width:0;
  justify-content:center;
  font-size:0.95rem;
  padding:14px 22px;
  border-radius:12px;
}

/* Settings */
.settings-row{display:flex;align-items:center;gap:12px}
.settings-row label{font-size:0.75rem;font-weight:600;color:var(--text2)}
.settings-row select{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:6px 10px;
  color:var(--text);
  font-family:inherit;
  font-size:0.82rem;
  cursor:pointer;
}

/* Status bar */
.status-bar{
  display:none;
  align-items:center;
  gap:12px;
  padding:8px 28px;
  background:var(--surface2);
  border-top:1px solid var(--border);
  font-size:0.72rem;
  color:var(--text3);
  font-family:'DM Mono',monospace;
}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.status-dot.ready{background:var(--green)}
.status-dot.processing{background:var(--amber)}

/* Toast */
.toast-container{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--surface3);
  border:1px solid var(--border-light);
  border-radius:var(--radius-sm);
  padding:12px 18px;
  font-size:0.82rem;
  font-weight:500;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:10px;
  max-width:360px;
}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}
.toast.info{border-left:3px solid #3b82f6}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* Modal */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px;
  width:90%;
  max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
@keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal h3{font-size:1rem;font-weight:700;margin-bottom:16px}
.modal .form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.modal label{font-size:0.75rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0}
.modal input[type="text"],.modal input[type="file"]{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:10px 12px;
  color:var(--text);
  font-family:inherit;
  font-size:0.85rem;
}
.modal input[type="text"]:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-color:var(--red)}
.modal input[type="file"]{padding:8px;cursor:pointer}
.modal input[type="file"]::file-selector-button{
  background:var(--surface3);
  border:1px solid var(--border-light);
  border-radius:5px;
  padding:6px 14px;
  color:var(--text);
  font-family:inherit;
  font-size:0.8rem;
  cursor:pointer;
  margin-right:10px;
  transition:background var(--transition);
}
.modal input[type="file"]::file-selector-button:hover{background:var(--border)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* Responsive */
@media(max-width:1080px){
  .workspace.active{grid-template-columns:1fr}
  .main-content{padding-bottom:118px}
  .canvas-wrapper{width:min(100%,560px,calc((100dvh - 230px) * 0.7727))}
  .action-bar{
    position:fixed;
    left:22px;
    right:22px;
    bottom:calc(18px + env(safe-area-inset-bottom));
    margin:0 auto;
    max-width:980px;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .action-summary{min-width:220px;width:auto}
  .btn-main{width:auto;min-width:260px}
}
@media(max-width:860px){
  .app-layout{height:auto;min-height:calc(100vh - 82px)}
  .app-layout{grid-template-columns:1fr}
  .sidebar{border-right:none;border-bottom:1px solid var(--border);max-height:200px}
  .main-content{overflow:visible}
  .canvas-wrapper{width:min(100%,430px)}
  .action-bar{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:none}
  .action-bar{align-items:stretch}
  .action-summary,.btn-main{width:100%}
}
@media(max-width:640px){
  .header{padding:0 16px}
  .main-content{padding:16px}
  .action-bar{flex-direction:column}
  .btn{justify-content:center}
  .toast-container{top:auto;left:12px;right:12px;bottom:12px;transform:none}
  .toast{max-width:none;padding:10px 12px}
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">SelloGuía <mark>beta</mark></div>
  <div class="header-right">
    <span class="page-count" id="pageCount">0 págs</span>
    <button class="btn-icon" onclick="resetAll()" title="Nuevo" aria-label="Nueva guía">⟳</button>
  </div>
</header>

<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Biblioteca de Timbres</h2>
      <button class="btn-icon" onclick="openAddStampModal()" title="Agregar timbre" aria-label="Agregar timbre">+</button>
    </div>
    <div class="stamp-list" id="stampList">
      <div class="sidebar-empty">
        <div class="icon">🖼️</div>
        <p>No hay timbres aún.<br>Agrega el primero con el botón +</p>
      </div>
    </div>
  </aside>

  <main class="main-content" id="mainContent">
    <button class="upload-zone" id="uploadZone" type="button" onclick="openPdfPicker()" aria-label="Seleccionar PDF">
      <span class="upload-icon" aria-hidden="true">📄</span>
      <h3>Carga tu guía de despacho</h3>
      <p>Arrastra un archivo PDF o haz clic para seleccionarlo</p>
      <span class="upload-hint">PDF hasta 50 MB · Múltiples páginas</span>
    </button>

    <div class="workspace" id="workspace">
      <div class="workspace-toolbar">
        <div class="file-badge" id="fileBadge">
          <span class="name">--</span>
          <span class="pages">·</span>
          <button class="close" type="button" onclick="resetAll()" aria-label="Quitar guía">✕</button>
        </div>
        <div class="live-time" id="liveTime">
          <span class="label">Hora actual</span>
          <span class="value" id="timeDisplay">--:--:--</span>
        </div>
      </div>

      <div class="editor-section">
        <div class="editor-card">
          <div class="editor-header">
            <h3>Mueve el timbre o la hora directo sobre la guía</h3>
            <button class="btn btn-secondary btn-sm" onclick="applyGuidePreset()">Restablecer posición</button>
          </div>
          <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="pageCanvas"></canvas>
            <canvas id="markerCanvas"></canvas>
          </div>
        </div>
      </div>

      <div class="action-bar">
        <div class="action-summary">
          <span class="status-icon" id="actionIcon" aria-hidden="true">📄</span>
          <div class="action-copy">
            <strong id="actionTitle">PDF cargado</strong>
            <span id="actionHint">Revisa la posición y aplica el sello.</span>
          </div>
        </div>
        <button class="btn btn-primary btn-main" id="btnApply" onclick="handlePrimaryAction()" disabled>✦ Aplicar sello</button>
      </div>
    </div>
  </main>
</div>

<footer class="status-bar">
  <span class="status-dot" id="statusDot"></span>
  <span id="statusText">Listo</span>
</footer>

<input type="file" id="fileInput" accept=".pdf" hidden onchange="handleFileSelect(event)">
<div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

<div class="modal-overlay" id="stampModal" style="display:none" onclick="if(event.target===this)closeAddStampModal()" role="dialog" aria-modal="true" aria-labelledby="stampModalTitle">
  <div class="modal">
    <h3 id="stampModalTitle">Agregar Nuevo Timbre</h3>
    <div class="form-group">
      <label for="stampNameInput">Nombre de la persona</label>
      <input type="text" id="stampNameInput" name="stampName" placeholder="Ej: Juan Pérez…" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="stampFileInput">Imagen del timbre (PNG, JPG)</label>
      <input type="file" id="stampFileInput" name="stampImage" accept="image/png,image/jpeg,image/webp">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" onclick="closeAddStampModal()">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="saveNewStamp()">Guardar Timbre</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
// ─── State ────────────────────────────────────────────────
const state = {
  pdfBytes: null,
  modifiedPdfBytes: null,
  pdfDoc: null,
  pageCount: 0,
  pageWidth: 0,
  pageHeight: 0,
  stampLibrary: [],
  selectedStampId: null,
  stampPosition: { x: 2, y: 232 },
  stampSize: { w: 30, h: 30 },
  timePosition: { x: 74, y: 236 },
  timeFormat: 'HH:mm',
  readyToPrint: false,
  _loading: false,
};

const PT_PER_MM = 72 / 25.4;
const DEFAULT_PAGE_POINTS = { width: 612, height: 792 };
const copyBytes = bytes => new Uint8Array(bytes);
const SETTINGS_VERSION = 2;
const TIME_FONT_SIZE_PT = 12;
const GUIDE_PRESET = {
  stampPosition: { x: 2, y: 232 },
  stampSize: { w: 30, h: 30 },
  timePosition: { x: 74, y: 236 },
  timeFormat: 'HH:mm',
};

// ─── DOM refs ────────────────────────────────────────────
const $ = id => document.getElementById(id);
const uploadZone = $('uploadZone');
const workspace = $('workspace');
const stampList = $('stampList');
const pageCount = $('pageCount');
const fileBadge = $('fileBadge');
const btnApply = $('btnApply');
const timeDisplay = $('timeDisplay');
const actionIcon = $('actionIcon');
const actionTitle = $('actionTitle');
const actionHint = $('actionHint');
const toastContainer = $('toastContainer');
const pageCanvas = $('pageCanvas');
const markerCanvas = $('markerCanvas');
const canvasWrapper = $('canvasWrapper');
const pctx = pageCanvas.getContext('2d');
const mctx = markerCanvas.getContext('2d');

// ─── Canvas editor state ─────────────────────────────────
let draggingMarker = null;
let stampPreviewImage = null;
let stampPreviewSource = '';

// ─── Init ─────────────────────────────────────────────────
if (typeof pdfjsLib !== 'undefined') {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
loadStampLibrary();
loadSettings();
updateClock();
setInterval(updateClock, 1000);
syncInputsFromState();

// ─── Drag & drop ──────────────────────────────────────────
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type === 'application/pdf') loadPdf(file);
  else toast('Solo se aceptan archivos PDF', 'error');
});

// ─── Canvas interaction ───────────────────────────────────
markerCanvas.addEventListener('mousedown', e => {
  if (!pageCanvas.width) return;
  const rect = markerCanvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / rect.width * pageCanvas.width;
  const sy = (e.clientY - rect.top) / rect.height * pageCanvas.height;

  const hitPad = 12;
  // Check stamp hit area
  const scx = stampCanvasX(), scy = stampCanvasY(), sw = stampCanvasW(), sh = stampCanvasH();
  if (sx > scx - hitPad && sx < scx + sw + hitPad && sy > scy - hitPad && sy < scy + sh + hitPad) {
    draggingMarker = 'stamp'; markerCanvas.style.cursor = 'grabbing'; e.preventDefault(); return;
  }
  // Check time hit area
  const tcx = timeCanvasX(), tcy = timeCanvasY();
  const timeSize = timeMarkerSize();
  if (sx > tcx - hitPad && sx < tcx + timeSize.w + hitPad && sy > tcy - hitPad && sy < tcy + timeSize.h + hitPad) {
    draggingMarker = 'time'; markerCanvas.style.cursor = 'grabbing'; e.preventDefault(); return;
  }
  // Place the nearest visible marker. This keeps the UI direct, without technical mode buttons.
  const stampDistance = Math.hypot(sx - (scx + sw / 2), sy - (scy + sh / 2));
  const timeDistance = Math.hypot(sx - (tcx + timeSize.w / 2), sy - (tcy + timeSize.h / 2));
  draggingMarker = stampDistance <= timeDistance ? 'stamp' : 'time';
  setMarkerFromCanvas(sx, sy, draggingMarker);
});

document.addEventListener('mousemove', e => {
  if (!draggingMarker || !pageCanvas.width) return;
  const rect = markerCanvas.getBoundingClientRect();
  const sx = Math.max(0, Math.min(pageCanvas.width, (e.clientX - rect.left) / rect.width * pageCanvas.width));
  const sy = Math.max(0, Math.min(pageCanvas.height, (e.clientY - rect.top) / rect.height * pageCanvas.height));
  setMarkerFromCanvas(sx, sy, draggingMarker);
});

document.addEventListener('mouseup', () => {
  draggingMarker = null;
  markerCanvas.style.cursor = 'grab';
});

markerCanvas.addEventListener('touchstart', e => {
  if (!pageCanvas.width || !e.touches[0]) return;
  const rect = markerCanvas.getBoundingClientRect();
  const sx = (e.touches[0].clientX - rect.left) / rect.width * pageCanvas.width;
  const sy = (e.touches[0].clientY - rect.top) / rect.height * pageCanvas.height;
  draggingMarker = nearestMarker(sx, sy);
  setMarkerFromCanvas(sx, sy, draggingMarker);
  e.preventDefault();
}, { passive: false });

// ─── Coordinate helpers ───────────────────────────────────
function stampCanvasX(){ return state.stampPosition.x / (state.pageWidth / PT_PER_MM) * pageCanvas.width; }
function stampCanvasY(){ return state.stampPosition.y / (state.pageHeight / PT_PER_MM) * pageCanvas.height; }
function stampCanvasW(){ return state.stampSize.w / (state.pageWidth / PT_PER_MM) * pageCanvas.width; }
function stampCanvasH(){ return state.stampSize.h / (state.pageHeight / PT_PER_MM) * pageCanvas.height; }
function timeCanvasX(){ return state.timePosition.x / (state.pageWidth / PT_PER_MM) * pageCanvas.width; }
function timeCanvasY(){ return state.timePosition.y / (state.pageHeight / PT_PER_MM) * pageCanvas.height; }
function selectedStamp(){ return state.stampLibrary.find(s => s.id === state.selectedStampId) || null; }
function timePreviewFontSize(){ return Math.max(12, TIME_FONT_SIZE_PT * (pageCanvas.height / state.pageHeight)); }
function timeMarkerSize(){
  const fontSize = timePreviewFontSize();
  const label = formatTime(new Date(), state.timeFormat.includes('ss') ? 'HH:mm:ss' : 'HH:mm');
  mctx.save();
  mctx.font = '800 ' + fontSize + 'px "DM Mono", ui-monospace, monospace';
  const w = mctx.measureText(label).width;
  mctx.restore();
  return { w: Math.ceil(w), h: Math.ceil(fontSize * 1.18) };
}

function getStampPreviewImage(stamp) {
  if (!stamp || !stamp.dataUrl) return null;
  if (stampPreviewSource !== stamp.dataUrl) {
    stampPreviewSource = stamp.dataUrl;
    stampPreviewImage = new Image();
    stampPreviewImage.onload = () => drawMarkers();
    stampPreviewImage.src = stamp.dataUrl;
  }
  return stampPreviewImage;
}

function nearestMarker(cx, cy) {
  const scx = stampCanvasX(), scy = stampCanvasY(), sw = stampCanvasW(), sh = stampCanvasH();
  const tcx = timeCanvasX(), tcy = timeCanvasY();
  const timeSize = timeMarkerSize();
  const stampDistance = Math.hypot(cx - (scx + sw / 2), cy - (scy + sh / 2));
  const timeDistance = Math.hypot(cx - (tcx + timeSize.w / 2), cy - (tcy + timeSize.h / 2));
  return stampDistance <= timeDistance ? 'stamp' : 'time';
}

function markPdfNeedsApply() {
  if (!state.pdfDoc) return;
  state.readyToPrint = false;
  state.modifiedPdfBytes = copyBytes(state.pdfBytes);
  updateApplyButton();
}

function setMarkerFromCanvas(cx, cy, which) {
  const mmX = cx / pageCanvas.width * (state.pageWidth / PT_PER_MM);
  const mmY = cy / pageCanvas.height * (state.pageHeight / PT_PER_MM);
  const vx = Math.max(0, Math.round(mmX * 2) / 2);
  const vy = Math.max(0, Math.round(mmY * 2) / 2);
  if (which === 'stamp') {
    state.stampPosition = { x: vx, y: vy };
  } else {
    state.timePosition = { x: vx, y: vy };
  }
  markPdfNeedsApply();
  drawMarkers();
}

function syncInputsFromState() {
  updateApplyButton();
}

function applyGuidePreset() {
  state.stampPosition = { ...GUIDE_PRESET.stampPosition };
  state.stampSize = { ...GUIDE_PRESET.stampSize };
  state.timePosition = { ...GUIDE_PRESET.timePosition };
  state.timeFormat = GUIDE_PRESET.timeFormat;
  syncInputsFromState();
  markPdfNeedsApply();
  drawMarkers();
  saveSettings();
}

// ─── Page rendering ───────────────────────────────────────
async function renderPageToCanvas() {
  if (!state.pdfBytes || !state.pageWidth) return;
  if (typeof pdfjsLib === 'undefined') {
    toast('Error: librería PDF no disponible', 'error');
    return;
  }
  try {
    await new Promise(r => requestAnimationFrame(r));
    let w = canvasWrapper.clientWidth - 24;
    if (!w || w < 50) { await new Promise(r => setTimeout(r, 150)); w = canvasWrapper.clientWidth - 24; }
    if (!w || w < 50) { toast('No se pudo determinar el ancho del visor', 'error'); return; }

    const pdfDoc = await pdfjsLib.getDocument({ data: copyBytes(state.pdfBytes) }).promise;
    const page = await pdfDoc.getPage(1);
    const viewport = page.getViewport({ scale: 1 });
    const maxPreviewHeight = Math.min(window.innerHeight * 0.74, 720);
    const scale = Math.min(Math.min(w, 980) / viewport.width, maxPreviewHeight / viewport.height);
    const sv = page.getViewport({ scale });
    const outputScale = Math.min(window.devicePixelRatio || 1, 2);

    pageCanvas.width = Math.floor(sv.width * outputScale);
    pageCanvas.height = Math.floor(sv.height * outputScale);
    pageCanvas.style.width = Math.floor(sv.width) + 'px';
    pageCanvas.style.height = Math.floor(sv.height) + 'px';
    markerCanvas.width = pageCanvas.width;
    markerCanvas.height = pageCanvas.height;
    markerCanvas.style.width = pageCanvas.style.width;
    markerCanvas.style.height = pageCanvas.style.height;

    await page.render({
      canvasContext: pctx,
      viewport: sv,
      transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null,
    }).promise;
    drawMarkers();
  } catch (err) {
    console.error('Render error:', err);
    toast('Error al visualizar la guía: ' + err.message, 'error');
  }
}

// ─── Draw markers ─────────────────────────────────────────
function drawMarkers() {
  if (!pageCanvas.width) return;
  mctx.clearRect(0, 0, markerCanvas.width, markerCanvas.height);

  // Stamp
  const scx = stampCanvasX(), scy = stampCanvasY(), sw = stampCanvasW(), sh = stampCanvasH();
  const stamp = selectedStamp();
  const stampImage = getStampPreviewImage(stamp);
  mctx.save();
  if (stampImage && stampImage.complete && stampImage.naturalWidth) {
    mctx.globalAlpha = 0.92;
    mctx.drawImage(stampImage, scx, scy, sw, sh);
    mctx.globalAlpha = 1;
  } else {
    mctx.fillStyle = 'rgba(232,17,27,0.08)';
    mctx.fillRect(scx, scy, sw, sh);
    mctx.fillStyle = '#e8111b'; mctx.font = 'bold 11px "Plus Jakarta Sans", sans-serif';
    mctx.textAlign = 'left'; mctx.fillText('TIMBRE', scx, Math.max(12, scy - 7));
  }
  mctx.restore();

  // Time
  const tcx = timeCanvasX(), tcy = timeCanvasY();
  const timeLabel = formatTime(new Date(), state.timeFormat.includes('ss') ? 'HH:mm:ss' : 'HH:mm');
  const timeFontSize = timePreviewFontSize();
  mctx.save();
  mctx.font = '800 ' + timeFontSize + 'px "DM Mono", ui-monospace, monospace';
  mctx.textAlign = 'left';
  mctx.textBaseline = 'top';
  mctx.fillStyle = '#050505';
  mctx.fillText(timeLabel, tcx, tcy);
  mctx.restore();
}

// Resize
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(async () => {
    if (state.pdfBytes && state.pageWidth) await renderPageToCanvas();
  }, 300);
});

// ─── Clock ────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  timeDisplay.textContent = formatTime(now, state.timeFormat.includes('ss') ? 'HH:mm:ss' : 'HH:mm');
  if (pageCanvas.width) drawMarkers();
}

function formatTime(date, fmt) {
  const h = String(date.getHours()).padStart(2, '0');
  const m = String(date.getMinutes()).padStart(2, '0');
  const s = String(date.getSeconds()).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  const mo = String(date.getMonth() + 1).padStart(2, '0');
  const y = date.getFullYear();
  return fmt.replace('HH', h).replace('mm', m).replace('ss', s).replace('dd', d).replace('MM', mo).replace('yyyy', y);
}

// ─── PDF Handling ─────────────────────────────────────────
function openPdfPicker(event) {
  if (event) event.stopPropagation();
  $('fileInput').click();
}

async function handleFileSelect(e) {
  const file = e.target.files[0];
  if (file) loadPdf(file);
}

async function loadPdf(file) {
  if (state._loading) return;
  if (file.size > 50 * 1024 * 1024) { toast('El archivo excede 50 MB', 'error'); return; }

  state._loading = true;
  setStatus('processing', 'Cargando PDF...');
  try {
    const arrayBuffer = await file.arrayBuffer();
    state.pdfBytes = new Uint8Array(arrayBuffer);
    state.pdfDoc = await PDFLib.PDFDocument.load(copyBytes(state.pdfBytes));
    const pages = state.pdfDoc.getPages();
    state.pageCount = pages.length;

    if (pages.length > 0) {
      const size = pages[0].getSize();
      state.pageWidth = size.width || DEFAULT_PAGE_POINTS.width;
      state.pageHeight = size.height || DEFAULT_PAGE_POINTS.height;
    }

    // Show workspace first so canvas wrapper has width
    uploadZone.style.display = 'none';
    workspace.classList.add('active');
    pageCount.textContent = pages.length + ' págs';
    pageCount.classList.add('visible');
    fileBadge.querySelector('.name').textContent = file.name;
    fileBadge.querySelector('.pages').textContent = pages.length + ' página' + (pages.length !== 1 ? 's' : '');

    // Render page to canvas
    await renderPageToCanvas();

    updateApplyButton();
    state.modifiedPdfBytes = copyBytes(state.pdfBytes);
    state.readyToPrint = false;

    setStatus('ready', 'PDF cargado — ' + pages.length + ' páginas');
    if (!state.selectedStampId) {
      toast('Agrega o selecciona un timbre para poder aplicar sellos', 'info');
    }
    saveSettings();
  } catch (err) {
    console.error(err);
    setStatus('error', 'Error');
    toast('Error al procesar el PDF: ' + err.message, 'error');
  } finally {
    state._loading = false;
  }
}

// ─── Apply Stamps ─────────────────────────────────────────
function handlePrimaryAction() {
  if (state.readyToPrint) printPdf();
  else applyStamps();
}

async function applyStamps() {
  if (!state.pdfDoc || !state.selectedStampId) {
    toast('Selecciona un timbre primero', 'error');
    return;
  }
  const stamp = state.stampLibrary.find(s => s.id === state.selectedStampId);
  if (!stamp) { toast('Timbre no encontrado', 'error'); return; }

  setStatus('processing', 'Aplicando sellos...');
  btnApply.disabled = true;
  btnApply.textContent = '⏳ Procesando...';

  try {
    const pdfDoc = await PDFLib.PDFDocument.load(copyBytes(state.pdfBytes));
    const pages = pdfDoc.getPages();
    const stampBytes = base64ToBytes(stamp.dataUrl.split(',')[1]);
    const stampImage = stamp.dataUrl.startsWith('data:image/png')
      ? await pdfDoc.embedPng(stampBytes)
      : await pdfDoc.embedJpg(stampBytes);
    const font = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
    const now = new Date();
    const timeStr = formatTime(now, state.timeFormat);
    const fontSize = TIME_FONT_SIZE_PT;

    const stampWpt = state.stampSize.w * PT_PER_MM;
    const stampHpt = stampWpt * (stamp.natH / stamp.natW);

    for (const page of pages) {
      const { height } = page.getSize();
      const sx = state.stampPosition.x * PT_PER_MM;
      const sy = height - (state.stampPosition.y * PT_PER_MM) - stampHpt;
      page.drawImage(stampImage, { x: sx, y: sy, width: stampWpt, height: stampHpt, opacity: 0.9 });

      const tx = state.timePosition.x * PT_PER_MM;
      const ty = height - (state.timePosition.y * PT_PER_MM) - fontSize;
      page.drawText(timeStr, { x: tx, y: ty, size: fontSize, font, color: PDFLib.rgb(0, 0, 0) });
    }

    state.modifiedPdfBytes = await pdfDoc.save();
    state.readyToPrint = true;
    updateApplyButton();
    setStatus('ready', 'Sellos aplicados — listo para imprimir');
  } catch (err) {
    console.error(err);
    toast('Error al aplicar sellos: ' + err.message, 'error');
    setStatus('error', 'Error');
  } finally {
    updateApplyButton();
  }
}

function printPdf() {
  if (!state.modifiedPdfBytes) return;
  const blob = new Blob([state.modifiedPdfBytes], { type: 'application/pdf' });
  const w = window.open(URL.createObjectURL(blob), '_blank');
  if (w) w.addEventListener('load', () => w.print());
}

// ─── Stamp Library ────────────────────────────────────────
function loadStampLibrary() {
  try { state.stampLibrary = JSON.parse(localStorage.getItem('selloguia_stamps') || '[]'); renderStampList(); }
  catch { state.stampLibrary = []; }
}
function saveStampLibrary() { localStorage.setItem('selloguia_stamps', JSON.stringify(state.stampLibrary)); }

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('selloguia_settings') || '{}');
    if (s.version !== SETTINGS_VERSION) return;
    if (s.stampPosition) state.stampPosition = s.stampPosition;
    if (s.timePosition) state.timePosition = s.timePosition;
    if (s.stampSize) state.stampSize = s.stampSize;
    if (s.timeFormat) state.timeFormat = s.timeFormat;
  } catch {}
}
function saveSettings() {
  localStorage.setItem('selloguia_settings', JSON.stringify({
    version: SETTINGS_VERSION,
    stampPosition: state.stampPosition, timePosition: state.timePosition,
    stampSize: state.stampSize, timeFormat: state.timeFormat,
  }));
}

function renderStampList() {
  if (!state.stampLibrary.length) {
    stampList.innerHTML = '<div class="sidebar-empty"><div class="icon">🖼️</div><p>No hay timbres aún.<br>Agrega el primero con el botón +</p></div>';
    return;
  }
  stampList.innerHTML = state.stampLibrary.map(s => `
    <div class="stamp-row">
      <button class="stamp-item ${s.id === state.selectedStampId ? 'selected' : ''}" type="button" onclick="selectStamp('${s.id}')" aria-label="Seleccionar timbre ${escapeHtml(s.name)}">
        <div class="stamp-thumb">${s.dataUrl ? `<img src="${s.dataUrl}" alt="">` : '<span class="placeholder" aria-hidden="true">👤</span>'}</div>
        <div class="stamp-info">
          <div class="stamp-name">${escapeHtml(s.name)}</div>
          <div class="stamp-meta">${s.addedAt || ''}</div>
        </div>
      </button>
      <button class="stamp-delete" type="button" onclick="removeStamp('${s.id}')" title="Eliminar" aria-label="Eliminar timbre ${escapeHtml(s.name)}">✕</button>
    </div>`).join('');
  updateApplyButton();
}

function selectStamp(id) {
  state.selectedStampId = id;
  const stamp = state.stampLibrary.find(s => s.id === id);
  if (stamp) {
    state.stampSize.h = state.stampSize.w * (stamp.natH / stamp.natW);
    markPdfNeedsApply();
    if (pageCanvas.width) drawMarkers();
  }
  renderStampList();
  updateApplyButton();
}

function removeStamp(id) {
  if (!confirm('¿Eliminar este timbre?')) return;
  state.stampLibrary = state.stampLibrary.filter(s => s.id !== id);
  if (state.selectedStampId === id) state.selectedStampId = null;
  markPdfNeedsApply();
  saveStampLibrary();
  renderStampList();
}

function openAddStampModal() {
  $('stampModal').style.display = 'flex';
  $('stampNameInput').value = '';
  $('stampFileInput').value = '';
  $('stampNameInput').focus();
}
function closeAddStampModal() { $('stampModal').style.display = 'none'; }

function saveNewStamp() {
  const name = $('stampNameInput').value.trim();
  const file = $('stampFileInput').files[0];
  if (!name) { toast('Ingresa un nombre', 'error'); return; }
  if (!file) { toast('Selecciona una imagen', 'error'); return; }
  if (file.size > 2 * 1024 * 1024) { toast('La imagen no debe superar 2 MB', 'error'); return; }

  const reader = new FileReader();
  reader.onload = function() {
    const img = new Image();
    img.onload = function() {
      let dataUrl = reader.result;
      if (img.width > 300 || img.height > 300) {
        const scale = Math.min(300 / img.width, 300 / img.height);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        dataUrl = c.toDataURL('image/png');
      }
      const stamp = {
        id: 's_' + Date.now(),
        name: name,
        dataUrl: dataUrl,
        natW: img.width,
        natH: img.height,
        addedAt: formatTime(new Date(), 'dd/MM/yyyy'),
      };
      state.stampLibrary.push(stamp);
      state.selectedStampId = stamp.id;
      state.stampSize.h = state.stampSize.w * (stamp.natH / stamp.natW);
      markPdfNeedsApply();
      saveStampLibrary();
      renderStampList();
      if (pageCanvas.width) drawMarkers();
      closeAddStampModal();
      toast('Timbre de ' + name + ' agregado', 'success');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function updateApplyButton() {
  const hasPdf = Boolean(state.pdfDoc);
  const hasStamp = Boolean(state.selectedStampId);
  btnApply.disabled = !(hasPdf && hasStamp);
  if (!hasPdf) {
    btnApply.textContent = '✦ Aplicar sello';
    actionIcon.textContent = '📄';
    actionTitle.textContent = 'Carga una guía';
    actionHint.textContent = 'Selecciona un PDF para comenzar.';
    return;
  }
  if (!hasStamp) {
    btnApply.textContent = 'Agrega un timbre';
    actionIcon.textContent = '⚠';
    actionTitle.textContent = 'Falta el timbre';
    actionHint.textContent = 'Agrega o selecciona un timbre para aplicar.';
    return;
  }
  if (state.readyToPrint) {
    btnApply.textContent = '🖨 Imprimir guía';
    actionIcon.textContent = '✓';
    actionTitle.textContent = 'Lista para imprimir';
    actionHint.textContent = 'El sello y la hora ya fueron aplicados.';
    return;
  }
  btnApply.textContent = '✦ Aplicar sello a ' + state.pageCount + ' páginas';
  actionIcon.textContent = '✦';
  actionTitle.textContent = 'Lista para aplicar';
  actionHint.textContent = 'Revisa la posición y aplica el sello.';
}

// ─── Reset ────────────────────────────────────────────────
function resetAll() {
  state.pdfBytes = null; state.modifiedPdfBytes = null; state.pdfDoc = null;
  state.pageCount = 0; state.pageWidth = 0; state.pageHeight = 0;
  state.readyToPrint = false;
  uploadZone.style.display = '';
  workspace.classList.remove('active');
  pageCount.classList.remove('visible');
  $('fileInput').value = '';
  pageCanvas.width = 0; pageCanvas.height = 0;
  markerCanvas.width = 0; markerCanvas.height = 0;
  updateApplyButton();
  setStatus('idle', 'Listo');
}

// ─── Utilities ────────────────────────────────────────────
function setStatus(s, text) {
  $('statusText').textContent = text;
  $('statusDot').className = 'status-dot ' + s;
}

function toast(message, type) {
  type = type || 'info';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = '<span>' + ({ success: '✓', error: '✕', info: 'ℹ' }[type] || '') + '</span> ' + message;
  toastContainer.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(40px)'; el.style.transition = 'all 200ms ease'; setTimeout(() => el.remove(), 200); }, 3000);
}

function base64ToBytes(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    if (!btnApply.disabled) handlePrimaryAction();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
    e.preventDefault();
    if (state.readyToPrint) printPdf();
  }
});
</script>
